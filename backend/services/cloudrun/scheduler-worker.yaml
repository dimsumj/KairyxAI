apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: scheduler-worker
spec:
  template:
    spec:
      serviceAccountName: scheduler-worker
      containers:
        - image: us-docker.pkg.dev/PROJECT_ID/kairyx/kairyxai@sha256:REPLACE_WITH_IMAGE_DIGEST
          env:
            - name: APP_ENV
              value: prod
            - name: SERVICE_ROLE
              value: scheduler-worker
            - name: SCHEDULER_ENABLED
              value: "true"
            - name: WORKER_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worker-shared-token
                  key: latest
          ports:
            - containerPort: 8080
